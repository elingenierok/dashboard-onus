<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratorio ISP - Triage & Testing de ONUs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
  .card-form { background: #1e293b; border: 1px solid #334155; padding: 24px; border-radius: 12px; width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 1.25rem; color: #38bdf8; text-align: center; margin-bottom: 8px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 0.85rem; font-weight: 600; color: #cbd5e1; }
  input, select { background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 6px; font-size: 0.9rem; }
  input:focus, select:focus { outline: none; border-color: #0284c7; }
  
  /* Checklist Pruebas */
  .checklist { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
  .check-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
  .check-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
  
  /* Botón de Veredicto */
  .veredicto-box { padding: 12px; border-radius: 6px; font-weight: 800; text-align: center; font-size: 1rem; text-transform: uppercase; }
  .veredicto-ok { background: #166534; color: #bbf7d0; border: 1px solid #22c55e; }
  .veredicto-fail { background: #991b1b; color: #fecaca; border: 1px solid #ef4444; }

  .btn-submit { background: #0284c7; color: white; border: none; padding: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; font-size: 0.95rem; margin-top: 8px; }
  .btn-submit:hover { background: #0369a1; }
  .status-msg { text-align: center; font-size: 0.82rem; font-weight: 600; }
</style>
</head>
<body>

<form id="formTriage" class="card-form">
  <h1>🔬 Triage & Testing de ONUs</h1>

  <div class="form-group">
    <label>📷 Número de Serie (SN / MAC)</label>
    <input type="text" id="serial_number" placeholder="Escanear o escribir SN..." required autofocus>
  </div>

  <div class="form-group">
    <label>📦 Modelo de Equipo</label>
    <select id="modelo" required>
      <option value="ONU ZTE F6201B V9.3 WIFI6 AX3000">ONU ZTE F6201B V9.3 WIFI6 AX3000</option>
      <option value="ONU ZTE ZXHN F6600P DB/WIFI6 (FXS)">ONU ZTE ZXHN F6600P DB/WIFI6 (FXS)</option>
      <option value="ONU ZTE F670L V1.1 DUAL BAND WIFI">ONU ZTE F670L V1.1 DUAL BAND WIFI</option>
      <option value="ONU HUAWEI ECHOLIFE EG8147X6">ONU HUAWEI ECHOLIFE EG8147X6</option>
      <option value="ONU ZTE F6600R DUAL BAND WIFI (CATV)">ONU ZTE F6600R DUAL BAND WIFI (CATV)</option>
      <option value="ONU HUAWEI HG8240H (Legacy)">ONU HUAWEI HG8240H (Legacy)</option>
      <option value="Otro Modelo">Otro Modelo / Desconocido</option>
    </select>
  </div>

  <div class="form-group">
    <label>🚚 Tipo de Origen</label>
    <select id="origen_tipo" required>
      <option value="Personal Retiro">Personal de Retiro Dedicado</option>
      <option value="Tecnico Reclamos">Técnico de Reclamos / Tercerizado</option>
    </select>
  </div>

  <div class="form-group">
    <label>👤 Técnico Origen / Observaciones</label>
    <input type="text" id="tecnico_origen" placeholder="Ej: Técnico Juan Pérez">
  </div>

  <!-- Pruebas Técnicas -->
  <label>🛠️ Pruebas de Laboratorio</label>
  <div class="checklist">
    <div class="check-item">
      <span>⚡ Encendido & Boot General</span>
      <input type="checkbox" id="test_encendido" checked onchange="evaluarVeredicto()">
    </div>
    <div class="check-item">
      <span>📶 Potencia Óptica RX (-15 a -27 dBm)</span>
      <input type="checkbox" id="test_optica" checked onchange="evaluarVeredicto()">
    </div>
    <div class="check-item">
      <span>🌐 Puertos LAN / FXS & Wi-Fi OK</span>
      <input type="checkbox" id="test_ports_wifi" checked onchange="evaluarVeredicto()">
    </div>
  </div>

  <div class="form-group">
    <label>💵 Valor Estimado Revalorizado (USD)</label>
    <input type="number" id="valor_usd" value="45" step="5">
  </div>

  <!-- Estado Resultante Calculado -->
  <div id="boxVeredicto" class="veredicto-box veredicto-ok">
    Veredicto: 🟢 CIRCULACIÓN
  </div>

  <button type="submit" class="btn-submit">💾 Registrar y Siguiente</button>
  <div id="statusMsg" class="status-msg"></div>
</form>

<script>
  const SUPABASE_URL = 'https://ovluxdezwvuonlwnymna.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_M2j4ddXtauXgPDqtOsNZow_-X0hLW-S';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let estadoFinalCalculado = 'CIRCULACION';

  function evaluarVeredicto() {
    const encendido = document.getElementById('test_encendido').checked;
    const optica = document.getElementById('test_optica').checked;
    const ports = document.getElementById('test_ports_wifi').checked;

    const box = document.getElementById('boxVeredicto');
    if (encendido && optica && ports) {
      estadoFinalCalculado = 'CIRCULACION';
      box.className = 'veredicto-box veredicto-ok';
      box.textContent = 'Veredicto: 🟢 CIRCULACIÓN';
    } else {
      estadoFinalCalculado = 'DESCARTE';
      box.className = 'veredicto-box veredicto-fail';
      box.textContent = 'Veredicto: 🔴 DESCARTE (CON FALLA)';
    }
  }

  document.getElementById('formTriage').addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusMsg = document.getElementById('statusMsg');
    statusMsg.textContent = '⏳ Guardando...';
    statusMsg.style.color = '#38bdf8';

    const payload = {
      serial_number: document.getElementById('serial_number').value.trim(),
      modelo: document.getElementById('modelo').value,
      origen_tipo: document.getElementById('origen_tipo').value,
      tecnico_origen: document.getElementById('tecnico_origen').value.trim(),
      resultado_encendido: document.getElementById('test_encendido').checked,
      resultado_optica: document.getElementById('test_optica').checked,
      resultado_ports_wifi: document.getElementById('test_ports_wifi').checked,
      estado_final: estadoFinalCalculado,
      valor_usd: parseFloat(document.getElementById('valor_usd').value) || 0,
      probado_por: 'Laboratorio Triage'
    };

    const { error } = await supabaseClient.from('registro_recupero').insert([payload]);

    if (error) {
      console.error(error);
      statusMsg.textContent = '❌ Error al guardar en Supabase';
      statusMsg.style.color = '#ef4444';
    } else {
      statusMsg.textContent = '✅ ¡Equipo registrado exitosamente!';
      statusMsg.style.color = '#4ade80';

      // Resetear campos para la siguiente ONU
      document.getElementById('serial_number').value = '';
      document.getElementById('test_encendido').checked = true;
      document.getElementById('test_optica').checked = true;
      document.getElementById('test_ports_wifi').checked = true;
      evaluarVeredicto();
      document.getElementById('serial_number').focus();
    }
  });
</script>
</body>
</html>
