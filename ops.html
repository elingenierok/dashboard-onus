<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suite Operativa - ISP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  .suite-container { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 16px; }
  
  .header { text-align: center; margin-bottom: 4px; }
  .header h1 { font-size: 1.3rem; color: #38bdf8; font-weight: 800; }
  .header p { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }

  .ops-nav { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; background: #1e293b; padding: 6px; border-radius: 10px; border: 1px solid #334155; }
  .ops-tab { padding: 10px 4px; border: none; background: transparent; color: #94a3b8; font-weight: 700; font-size: 0.78rem; border-radius: 6px; cursor: pointer; transition: all 0.2s; text-align: center; }
  .ops-tab.active { background: #0284c7; color: white; }

  .card-form { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; display: none; flex-direction: column; gap: 14px; }
  .card-form.active { display: flex; }
  
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 0.82rem; font-weight: 600; color: #cbd5e1; }
  input, select { background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 6px; font-size: 0.9rem; }
  input:focus, select:focus { outline: none; border-color: #0284c7; }

  .info-equipo { background: #0f172a; border: 1px dashed #0284c7; padding: 10px 14px; border-radius: 8px; font-size: 0.82rem; color: #38bdf8; display: none; }
  .banner-testeado { background: #1e1b4b; border: 1px solid #6366f1; color: #a5b4fc; padding: 12px; border-radius: 8px; font-size: 0.82rem; display: none; line-height: 1.4; }

  .checklist { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
  .check-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; }
  .check-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }

  .veredicto-box { padding: 10px; border-radius: 6px; font-weight: 800; text-align: center; font-size: 0.9rem; text-transform: uppercase; }
  .veredicto-ok { background: #166534; color: #bbf7d0; border: 1px solid #22c55e; }
  .veredicto-fail { background: #991b1b; color: #fecaca; border: 1px solid #ef4444; }

  .btn-submit { background: #0284c7; color: white; border: none; padding: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; font-size: 0.95rem; margin-top: 6px; }
  .btn-submit:hover { background: #0369a1; }
  .btn-submit:disabled { background: #334155; cursor: not-allowed; opacity: 0.5; }
  .btn-secondary { background: #334155; color: white; border: none; padding: 8px 12px; font-weight: 600; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
  .status-msg { text-align: center; font-size: 0.82rem; font-weight: 600; line-height: 1.3; }
</style>
</head>
<body>

<div class="suite-container">
  <header class="header">
    <h1>🛠️ Suite Operativa ISP</h1>
    <p>Recepción, Pruebas de Laboratorio y Auditoría</p>
  </header>

  <nav class="ops-nav">
    <button class="ops-tab active" onclick="switchOps('form-carga', this)">📥 1. CARGA</button>
    <button class="ops-tab" onclick="switchOps('form-prueba', this)">🔬 2. PRUEBAS</button>
    <button class="ops-tab" onclick="switchOps('form-auditoria', this)">📋 3. AUDITORÍA</button>
  </nav>

  <!-- 1. CARGA DE EQUIPOS -->
  <form id="form-carga" class="card-form active">
    <div class="form-group">
      <label>📷 Número de Serie / MAC (SN)</label>
      <input type="text" id="cg_serial" placeholder="Escanear o escribir SN..." required autofocus>
    </div>

    <div class="form-group">
      <label>📦 Modelo de Equipo</label>
      <select id="cg_modelo" required>
        <option value="" disabled selected>-- Seleccionar Modelo --</option>
        <option value="ONU ZTE F6201B V9.3 WIFI6 AX3000">ONU ZTE F6201B V9.3 WIFI6 AX3000</option>
        <option value="ONU ZTE F6201B V9.3 WIFI6 AX3000(USADO)">ONU ZTE F6201B V9.3 WIFI6 AX3000 (USADO)</option>
        <option value="ONU ZTE ZXHN F6600P DB/WIFI6 (FXS)">ONU ZTE ZXHN F6600P DB/WIFI6 (FXS)</option>
        <option value="ONU ZTE ZXHN F6600P DB/WIFI6 (FXS) (USADA)">ONU ZTE ZXHN F6600P DB/WIFI6 (FXS) (USADA)</option>
        <option value="ONU ZTE F670L V1.1 DUAL BAND WIFI (USADA)">ONU ZTE F670L V1.1 DUAL BAND WIFI (USADA)</option>
        <option value="ONU HUAWEI ECHOLIFE EG8147X6">ONU HUAWEI ECHOLIFE EG8147X6</option>
        <option value="ONU HUAWEI ECHOLIFE EG8147X6(USADO)">ONU HUAWEI ECHOLIFE EG8147X6 (USADO)</option>
        <option value="ONU ZTE F6600R DUAL BAND WIFI (CATV)">ONU ZTE F6600R DUAL BAND WIFI (CATV)</option>
        <option value="ONU ZTE F6600R DUAL BAND WIFI (CATV)(USADA)">ONU ZTE F6600R DUAL BAND WIFI (CATV) (USADA)</option>
        <option value="ONU HUAWEI 2.4 H5">ONU HUAWEI 2.4 H5 (OBSOLETA)</option>
        <option value="2.4 Huawei A5">2.4 Huawei A5 (OBSOLETA)</option>
        <option value="CHINA MOBILE">CHINA MOBILE (OBSOLETA)</option>
        <option value="OTRO MODELO / OBSOLETO">OTRO MODELO / OBSOLETO</option>
      </select>
    </div>

    <div class="form-group">
      <label>🚚 Origen del Equipo</label>
      <select id="cg_origen" required>
        <option value="Personal Retiro">Personal de Retiro Dedicado</option>
        <option value="Tecnico Reclamos">Técnico de Reclamos / Terceros</option>
        <option value="Sucursal / Mostrador">Devolución Sucursal / Mostrador</option>
      </select>
    </div>

    <div class="form-group">
      <label>👤 Técnico Origen / Observaciones</label>
      <input type="text" id="cg_tecnico" placeholder="Nombre del técnico o detalle de retiro">
    </div>

    <button type="submit" class="btn-submit">💾 Ingresar Equipo a Laboratorio</button>
    <div id="statusCarga" class="status-msg"></div>
  </form>

  <!-- 2. PRUEBAS DE LABORATORIO -->
  <form id="form-prueba" class="card-form">
    <div class="form-group">
      <label>🔍 Buscar SN para Probar</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="pr_serial" placeholder="Escanear o ingresar SN..." style="flex:1;">
        <button type="button" class="btn-secondary" onclick="buscarEquipoParaPrueba()">🔎 Buscar</button>
      </div>
    </div>

    <div id="infoEquipoEnc" class="info-equipo">
      <strong id="infModelo">Modelo: -</strong><br>
      <span id="infOrigen">Origen: -</span>
    </div>

    <div id="bannerTesteado" class="banner-testeado"></div>

    <div id="blockControlesPrueba" style="display: flex; flex-direction: column; gap: 14px;">
      <label>🛠️ Pruebas de Laboratorio</label>
      <div class="checklist">
        <div class="check-item"><span>⚡ Encendido & Boot General</span><input type="checkbox" id="test_1" checked onchange="evaluarVeredictoPrueba()"></div>
        <div class="check-item"><span>🌐 Puertos LAN / FXS & Wi-Fi OK</span><input type="checkbox" id="test_2" checked onchange="evaluarVeredictoPrueba()"></div>
        <div class="form-group" style="margin-top:6px;">
          <label>📶 Potencia Óptica RX Medida (dBm)</label>
          <input type="number" id="test_dbm" placeholder="Ej: -21.5" step="0.1" value="-20.0" oninput="evaluarVeredictoPrueba()">
        </div>
      </div>

      <div class="form-group" id="groupMotivoFalla" style="display:none;">
        <label style="color:#f87171;">⚠️ Motivo de Falla (Seleccionar)</label>
        <select id="pr_motivo">
          <option value="Ninguno">Ninguno (Funcionamiento OK)</option>
          <option value="No Enciende / Boot Loop">No Enciende / Boot Loop</option>
          <option value="Mala Potencia Óptica / Laser Defectuoso">Mala Potencia Óptica / Laser Defectuoso</option>
          <option value="Puertos LAN / FXS o Wi-Fi Dañado">Puertos LAN / FXS o Wi-Fi Dañado</option>
          <option value="Tecnología Obsoleta (Sin Prueba)">Tecnología Obsoleta (Sin Prueba)</option>
        </select>
      </div>

      <div class="form-group">
        <label>👤 Técnico del Laboratorio</label>
        <input type="text" id="pr_tecnico_lab" placeholder="Tu nombre..." required>
      </div>

      <div id="boxVeredictoPrueba" class="veredicto-box veredicto-ok">Veredicto: 🟢 CIRCULACIÓN</div>
      <button type="submit" id="btnGuardarPrueba" class="btn-submit">💾 Guardar Resultado de Prueba</button>
    </div>
    <div id="statusPrueba" class="status-msg"></div>
  </form>

  <!-- 3. AUDITORÍA DE STOCK -->
  <form id="form-auditoria" class="card-form">
    <div class="form-group">
      <label>🏬 Sucursal / Depósito a Auditar</label>
      <select id="aud_sucursal" required>
        <option value="OBE_ALM_PRINCIPAL">OBE Principal</option>
        <option value="OBE_ALM_CATRIEL">OBE Catriel (Compras)</option>
        <option value="OBE_ALM_DEVOLUCIONES">OBE Devoluciones (Triage)</option>
        <option value="OBE_ALM_DESCARTE">OBE Descarte (Inmovilizado)</option>
        <option value="SPD_ALM_PRINCIPAL">San Pedro Principal</option>
        <option value="WND_ALM_PRINCIPAL">Wanda Principal</option>
        <option value="ITU_ALM_PRINCIPAL">Ituzaingó Principal</option>
        <option value="ELDO_ALM_PRINCIPAL">Eldorado Principal</option>
      </select>
    </div>

    <div class="form-group">
      <label>📦 Stock Físico Contado (Real)</label>
      <input type="number" id="aud_fisico" placeholder="Cantidad física en estantería..." required min="0">
    </div>

    <div class="form-group">
      <label>💻 Stock que figura en Sistema</label>
      <input type="number" id="aud_sistema" placeholder="Cantidad según sistema..." required min="0">
    </div>

    <div class="form-group">
      <label>👤 Nombre del Auditor</label>
      <input type="text" id="aud_nombre" placeholder="Tu nombre..." required>
    </div>

    <div class="form-group">
      <label>📝 Observación / Motivo de Desviación</label>
      <input type="text" id="aud_obs" placeholder="Ej: Faltan 2 ONUs enviadas sin remito">
    </div>

    <button type="submit" class="btn-submit">💾 Registrar Auditoría</button>
    <div id="statusAuditoria" class="status-msg"></div>
  </form>
</div>

<script>
  const SUPABASE_URL = 'https://ovluxdezwvuonlwnymna.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_M2j4ddXtauXgPDqtOsNZow_-X0hLW-S';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const LISTA_VIP_EXACTA = [
    "ONU ZTE F6201B V9.3 WIFI6 AX3000",
    "ONU ZTE F6201B V9.3 WIFI6 AX3000(USADO)",
    "ONU ZTE ZXHN F6600P DB/WIFI6 (FXS)",
    "ONU ZTE ZXHN F6600P DB/WIFI6 (FXS) (USADA)",
    "ONU ZTE F670L V1.1 DUAL BAND WIFI (USADA)",
    "ONU HUAWEI ECHOLIFE EG8147X6",
    "ONU HUAWEI ECHOLIFE EG8147X6(USADO)",
    "ONU ZTE F6600R DUAL BAND WIFI (CATV)",
    "ONU ZTE F6600R DUAL BAND WIFI (CATV)(USADA)"
  ];

  let equipoCargadoActual = null;
  let veredictoFinalCalculado = 'CIRCULACIÓN';

  function switchOps(tabId, btn) {
    document.querySelectorAll('.ops-tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.card-form').forEach(f => f.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(tabId).classList.add('active');
  }

  // 1. CARGA DE EQUIPOS
  document.getElementById('form-carga').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('statusCarga');
    const sn = document.getElementById('cg_serial').value.trim().toUpperCase();

    msg.textContent = '⏳ Verificando duplicados...';
    msg.style.color = '#38bdf8';

    const { data: exist } = await supabaseClient
      .from('registro_recupero')
      .select('serial_number, condicion, fecha_registro')
      .eq('serial_number', sn)
      .limit(1);

    if (exist && exist.length > 0) {
      const reg = exist[0];
      msg.textContent = `⚠️ El equipo con SN ${sn} ya se encuentra registrado con condición: [${reg.condicion}] (${reg.fecha_registro}).`;
      msg.style.color = '#fde047';
      return;
    }

    const modelo = document.getElementById('cg_modelo').value;

    const payload = {
      serial_number: sn,
      modelo: modelo,
      descripcion: modelo,
      origen: document.getElementById('cg_origen').value,
      origen_tipo: document.getElementById('cg_origen').value,
      tecnico_obs: document.getElementById('cg_tecnico').value.trim(),
      condicion: 'PENDIENTE',
      estado_final: 'PENDIENTE',
      cantidad: 1,
      fecha_registro: new Date().toISOString().split('T')[0]
    };

    const { error } = await supabaseClient.from('registro_recupero').insert([payload]);

    if (error) {
      msg.textContent = '❌ Error: ' + error.message;
      msg.style.color = '#ef4444';
    } else {
      msg.textContent = '✅ ¡Equipo cargado para pruebas!';
      msg.style.color = '#4ade80';
      document.getElementById('cg_serial').value = '';
      document.getElementById('cg_serial').focus();
    }
  });

  // 2. BUSCAR EQUIPO PARA PRUEBA
  async function buscarEquipoParaPrueba() {
    const sn = document.getElementById('pr_serial').value.trim().toUpperCase();
    const infoBox = document.getElementById('infoEquipoEnc');
    const bannerTesteado = document.getElementById('bannerTesteado');
    const blockControles = document.getElementById('blockControlesPrueba');
    const btnGuardar = document.getElementById('btnGuardarPrueba');
    const msg = document.getElementById('statusPrueba');

    if (!sn) return;

    msg.textContent = '⏳ Buscando equipo...';
    msg.style.color = '#38bdf8';

    const { data, error } = await supabaseClient
      .from('registro_recupero')
      .select('*')
      .eq('serial_number', sn)
      .order('id', { ascending: false })
      .limit(1);

    if (error || !data || data.length === 0) {
      msg.textContent = '⚠️ Este equipo no se encuentra en la lista de prueba.';
      msg.style.color = '#ef4444';
      infoBox.style.display = 'none';
      bannerTesteado.style.display = 'none';
      blockControles.style.display = 'none';
      equipoCargadoActual = null;
      return;
    }

    equipoCargadoActual = data[0];
    const descModelo = equipoCargadoActual.descripcion || equipoCargadoActual.modelo || '-';
    
    document.getElementById('infModelo').textContent = 'Modelo: ' + descModelo;
    document.getElementById('infOrigen').textContent = 'Origen: ' + (equipoCargadoActual.origen || '-');
    infoBox.style.display = 'block';

    const estadoActual = (equipoCargadoActual.condicion || equipoCargadoActual.estado_final || '').toUpperCase();

    if (estadoActual !== 'PENDIENTE') {
      bannerTesteado.style.display = 'block';
      bannerTesteado.innerHTML = `ℹ️ <strong>Equipo ya testeado en fecha ${equipoCargadoActual.fecha_registro || 'previa'}</strong><br>` +
        `Veredicto previo: <strong>${estadoActual}</strong><br>` +
        `Motivo / Detalle: ${equipoCargadoActual.motivo_falla || 'Ninguno'}`;
      
      blockControles.style.display = 'none';
      msg.textContent = 'ℹ️ Este equipo ya posee valores cargados y no se encuentra pendiente.';
      msg.style.color = '#a5b4fc';
    } else {
      bannerTesteado.style.display = 'none';
      blockControles.style.display = 'flex';
      btnGuardar.disabled = false;
      msg.textContent = '✅ Equipo listo para prueba de laboratorio.';
      msg.style.color = '#4ade80';
      evaluarVeredictoPrueba();
    }
  }

  function evaluarVeredictoPrueba() {
    const t1 = document.getElementById('test_1').checked;
    const t2 = document.getElementById('test_2').checked;
    const dbm = parseFloat(document.getElementById('test_dbm').value) || -99;
    const box = document.getElementById('boxVeredictoPrueba');
    const groupMotivo = document.getElementById('groupMotivoFalla');

    const modelo = equipoCargadoActual ? (equipoCargadoActual.descripcion || equipoCargadoActual.modelo || '').trim().toUpperCase() : '';
    const esVIP = LISTA_VIP_EXACTA.some(v => v.trim().toUpperCase() === modelo);

    const opticaValida = dbm >= -27.0 && dbm <= -15.0;
    const pasaPruebas = t1 && t2 && opticaValida;

    if (esVIP && pasaPruebas) {
      veredictoFinalCalculado = 'CIRCULACIÓN';
      box.className = 'veredicto-box veredicto-ok';
      box.textContent = 'Veredicto: 🟢 CIRCULACIÓN';
      groupMotivo.style.display = 'none';
    } else {
      veredictoFinalCalculado = 'DESCARTE';
      box.className = 'veredicto-box veredicto-fail';
      groupMotivo.style.display = 'flex';
      
      if (!esVIP) {
        box.textContent = 'Veredicto: 🔴 DESCARTE (TECNOLOGÍA OBSOLETA)';
        document.getElementById('pr_motivo').value = 'Tecnología Obsoleta (Sin Prueba)';
      } else {
        box.textContent = 'Veredicto: 🔴 DESCARTE (FALLA DE LAB)';
      }
    }
  }

  // GUARDAR PRUEBA
  document.getElementById('form-prueba').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('statusPrueba');

    if (!equipoCargadoActual) {
      msg.textContent = '⚠️ Primero debes buscar un número de serie válido.';
      msg.style.color = '#fde047';
      return;
    }

    msg.textContent = '⏳ Guardando prueba...';
    msg.style.color = '#38bdf8';

    const payloadUpdate = {
      condicion: veredictoFinalCalculado,
      estado_final: veredictoFinalCalculado,
      tecnico_obs: (equipoCargadoActual.tecnico_obs || '') + ' | Lab: ' + document.getElementById('pr_tecnico_lab').value.trim(),
      motivo_falla: veredictoFinalCalculado === 'DESCARTE' ? document.getElementById('pr_motivo').value : 'Ninguno'
    };

    const { error } = await supabaseClient
      .from('registro_recupero')
      .update(payloadUpdate)
      .eq('id', equipoCargadoActual.id);

    if (error) {
      msg.textContent = '❌ Error al actualizar: ' + error.message;
      msg.style.color = '#ef4444';
    } else {
      msg.textContent = '✅ ¡Resultado de laboratorio guardado!';
      msg.style.color = '#4ade80';
      document.getElementById('pr_serial').value = '';
      document.getElementById('infoEquipoEnc').style.display = 'none';
      document.getElementById('blockControlesPrueba').style.display = 'none';
      equipoCargadoActual = null;
    }
  });

  // 3. AUDITORÍA
  document.getElementById('form-auditoria').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('statusAuditoria');
    msg.textContent = '⏳ Guardando auditoría...';
    msg.style.color = '#38bdf8';

    const real = parseInt(document.getElementById('aud_fisico').value, 10) || 0;
    const sis = parseInt(document.getElementById('aud_sistema').value, 10) || 0;

    const payload = {
      sucursal: document.getElementById('aud_sucursal').value,
      stock_real: real,
      stock_sistema: sis,
      diferencia: real - sis,
      auditor_nombre: document.getElementById('aud_nombre').value.trim(),
      observaciones: document.getElementById('aud_obs').value.trim()
    };

    const { error } = await supabaseClient.from('auditoria_sucursales').insert([payload]);

    if (error) {
      msg.textContent = '❌ Error: ' + error.message;
      msg.style.color = '#ef4444';
    } else {
      msg.textContent = '✅ ¡Auditoría registrada exitosamente!';
      msg.style.color = '#4ade80';
      document.getElementById('aud_fisico').value = '';
      document.getElementById('aud_sistema').value = '';
      document.getElementById('aud_obs').value = '';
    }
  });

  document.getElementById('pr_serial').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      buscarEquipoParaPrueba();
    }
  });
</script>
</body>
</html>
